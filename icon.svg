<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#0c0503"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="102" fill="none" stroke="#ff5722" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="270" r="140" fill="#ff5722" opacity="0.15" filter="url(#glow)"/>

  <!-- Devil Horns -->
  <path d="M 170 200 C 140 130, 110 90, 130 65 C 160 85, 195 140, 205 190 Z" fill="#ff3d00" stroke="#7f1d1d" stroke-width="6"/>
  <path d="M 342 200 C 372 130, 402 90, 382 65 C 352 85, 317 140, 307 190 Z" fill="#ff3d00" stroke="#7f1d1d" stroke-width="6"/>

  <!-- Head / Face Body -->
  <path d="M 160 210 C 160 170, 352 170, 352 210 C 365 290, 350 380, 256 410 C 162 380, 147 290, 160 210 Z" fill="#d32f2f" stroke="#3b0a0a" stroke-width="8"/>

  <!-- Expressive Menacing Devil Eyes -->
  <!-- Left Eye -->
  <polygon points="185,250 240,270 195,290" fill="#ffea00" stroke="#ff3d00" stroke-width="3"/>
  <circle cx="212" cy="270" r="6" fill="#111"/>

  <!-- Right Eye -->
  <polygon points="327,250 272,270 317,290" fill="#ffea00" stroke="#ff3d00" stroke-width="3"/>
  <circle cx="300" cy="270" r="6" fill="#111"/>

  <!-- Sinister Grin / Fangs -->
  <path d="M 200 330 Q 256 385 312 330 Q 256 350 200 330 Z" fill="#111"/>
  <polygon points="220,335 230,352 240,336" fill="#fff"/>
  <polygon points="272,336 282,352 292,335" fill="#fff"/>
  <polygon points="248,358 256,346 264,358" fill="#fff"/>

  <!-- Golden Crown / AI Halo -->
  <path d="M 216 145 L 236 120 L 256 140 L 276 120 L 296 145 Z" fill="#ffca28" stroke="#ff8f00" stroke-width="4"/>
</svg>
